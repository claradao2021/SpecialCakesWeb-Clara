<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Cakes About page</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="header-top">

            <!-- Logo -->
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Special Cakes logo">
                </a>
            </div>

            <!-- Title -->
            <div class="main-title">
                <a href="index.html">
                    <h2>CAKES FOR ALL OCCASIONS</h2>
                </a>
            </div>

            <!-- Navigation -->
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cakes_for_sale.html">Cakes for sale</a></li>
                    <li><a href="about_us.html">About</a></li>
                    <li><a href="contact_us.html">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <div class="banner">
        <div class="container">
            <img src="images/Contact_us/4.1.contactus_banner_1200.jpg" 
                 alt="Special Cakes banner showing cakes and promotional text">
        </div>
    </div>

<main>

  <section class="contact">

  <!-- BOX TOP -->
  <div class="contact-header">
    <h1>Get in touch with us</h1>
    <p>If you have any questions about our cakes, catering or special orders,</p>
    <p>please contact us using the form below.</p>
  </div>

  <!-- BOX UNDER -->
  <div class="contact-content">

    <!-- LEFT: FORM -->
    <div class="contact-form">
      <h2>Contact form</h2>

      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" 
       pattern="[0-9]{2}-[0-9]{8}" 
       placeholder="02-12345678" 
       required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send</button>
      </form>
    </div>

    <!-- RIGHT: IMAGE -->
    <div class="contact-image">
      <img src="images/Contact_us/4.2.contactus_large_image_975.jpg" alt="The girl on phone thinking about cake">
    </div>

  </div>

</section>

</main>

<!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>Special cakes © 2026. Web created by Clara Dao.</p>
        </div>
    </footer>

</body>
</html>
